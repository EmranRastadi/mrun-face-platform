name: infra-validate

on:
  pull_request:
    paths:
      - 'infrastructure/**'
      - 'skaffold.yaml'
      - 'docker-compose.yml'

jobs:
  kustomize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for d in infrastructure/apps infrastructure/platform infrastructure/bootstrap; do
            if [ -f "$d/kustomization.yaml" ]; then
              echo "=== $d ==="
              kubectl kustomize "$d" > /dev/null || (echo "kustomize failed: $d" && exit 1)
            fi
          done
      - run: docker compose config > /dev/null

  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          # Validate env examples have no secrets hardcoded
          for f in apps/*/.env.example; do
            if grep -qiE '(password|secret|key).{0,2}[:=].{1,30}change' "$f"; then
              echo "WARNING: possible hardcoded secret in $f"
            fi
          done
      - run: |
          # Validate docker-compose has no plaintext defaults for critical infra
          for var in DATABASE_PASSWORD MINIO_ROOT_PASSWORD; do
            if grep -q "$var: " docker-compose.yml; then
              echo "WARNING: possible plaintext default for $var in docker-compose.yml"
            fi
          done

  skaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          skaffold diagnose - | head -30 || echo "skaffold diagnose exiting (may have warnings)"