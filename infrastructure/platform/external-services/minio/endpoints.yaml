apiVersion: v1
kind: Endpoints
metadata:
  name: minio
  namespace: mrun-system
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/component: external-service
subsets:
  - addresses:
      - ip: 172.19.0.1
    ports:
      - name: api
        port: 9000
        protocol: TCP
      - name: console
        port: 9001
        protocol: TCP
