apiVersion: v1
kind: Service

metadata:
  name: minio
  namespace: mrun-system
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/component: external-service
spec:
  type: ClusterIP
  ports:
    - name: api
      port: 9000
      targetPort: 9000
      protocol: TCP
    - name: console
      port: 9001
      targetPort: 9001
      protocol: TCP
