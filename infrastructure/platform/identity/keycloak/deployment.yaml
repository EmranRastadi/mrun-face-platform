apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: mrun-security
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.0.2
          args: ["start", "--http-enabled=true", "--hostname-strict=false"]
          envFrom:
            - configMapRef:
                name: keycloak
            - secretRef:
                name: keycloak
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /realms/master
              port: 8080
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /realms/master
              port: 8080
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /realms/master
              port: 8080
            periodSeconds: 15
            failureThreshold: 6
