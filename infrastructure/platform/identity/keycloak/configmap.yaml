apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak
  namespace: mrun-security
data:
  KC_DB: "postgres"
  KC_DB_URL: "jdbc:postgresql://postgresql.mrun-database.svc.cluster.local:5432/keycloak"
  KC_DB_USERNAME: "keycloak"
  KC_HTTP_ENABLED: "true"
  KC_HOSTNAME_STRICT: "false"
  KC_HEALTH_ENABLED: "true"
