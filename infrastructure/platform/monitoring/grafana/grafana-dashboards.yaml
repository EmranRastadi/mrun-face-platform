                "indexByName": {},
                "renameByName": {
                  "Value": "CPU cores"
                }
              }
            }
          ],
          "targets": [
            {
              "expr": "topk(10, sum(rate(container_cpu_usage_seconds_total{namespace=~\"$namespace\", pod=~\"$pod\", container!=\"\"}[$interval])) by (namespace, pod))",
              "refId": "A",
              "instant": true,
              "format": "table"
            }
          ]
        },
        {
          "type": "table",
