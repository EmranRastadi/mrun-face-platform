            }
          ]
        },
        {
          "type": "table",
          "title": "Top pods by CPU",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 10,
            "w": 12,
            "x": 0,
            "y": 29
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
