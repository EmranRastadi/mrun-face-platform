apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: mrun-monitoring
data:
  datasources.yaml: |
    apiVersion: 1
    deleteDatasources:
      - name: Loki
        orgId: 1
      - name: Tempo
        orgId: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.mrun-monitoring.svc.cluster.local:9090
        isDefault: true
        editable: false
        jsonData:
          timeInterval: "15s"
          queryTimeout: "30s"
          httpMethod: "POST"
