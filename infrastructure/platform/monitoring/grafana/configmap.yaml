apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: mrun-monitoring
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://kube-prometheus-stack-prometheus.mrun-monitoring.svc.cluster.local:9090
        isDefault: true
        editable: false
        jsonData:
          timeInterval: "15s"
          queryTimeout: "30s"
          httpMethod: "POST"

      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki.mrun-monitoring.svc.cluster.local:3100
        editable: false
        jsonData:
          maxLines: 1000

      - name: Tempo
        uid: tempo
        type: tempo
        access: proxy
        url: http://tempo.mrun-monitoring.svc.cluster.local:3200
        editable: false
        jsonData:
          tracesToLogsV2:
            datasourceUid: loki
            spanStartTimeShift: "-5m"
            spanEndTimeShift: "5m"
            filterByTraceID: true
            tags: [{ key: "service.name", value: "service" }]
          serviceMap:
            datasourceUid: prometheus
