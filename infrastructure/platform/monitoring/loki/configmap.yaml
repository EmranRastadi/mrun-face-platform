apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: mrun-monitoring
  labels:
    app.kubernetes.io/name: loki
data:
  config.yaml: |
    auth_enabled: false

    server:
      http_listen_port: 3100
      grpc_listen_port: 9096
      log_level: info

    common:
      instance_addr: 127.0.0.1
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory

    schema_config:
      configs:
        - from: 2024-04-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    limits_config:
      # Logs are development noise here: keep only the last 15 minutes so the
      # 10Gi volume never fills. The compactor deletes older chunks; nothing
      # else on the volume (rules, compactor state) is touched.
      retention_period: 15m
      allow_structured_metadata: true
      volume_enabled: true
      # Fluent Bit ships every container log in bursts; the 4 MB/s default
      # caused "ingestion rate limit exceeded" errors in the Loki distributor.
      # The kube-system reflector alone can burst past 8 MB/s, so keep this
      # generous for the local dev cluster.
      ingestion_rate_mb: 64
      ingestion_burst_size_mb: 128
      per_stream_rate_limit: 64MB
      per_stream_rate_limit_burst: 128MB

    compactor:
      working_directory: /loki/compactor
      # Retention is enforced every 5 minutes (default is 10m).
      compaction_interval: 5m
      retention_enabled: true
      # Default is 2h: chunks would linger long after the 15m retention.
      retention_delete_delay: 1m
      delete_request_store: filesystem

    ingester:
      # Flush chunks to the filesystem store quickly, otherwise a 30m idle
      # period / 2h max age would keep logs far longer than the 15m retention.
      # Retention works on whole chunks, so keep chunks short (5m) to bound the
      # effective log age to roughly retention + one chunk.
      chunk_idle_period: 2m
      max_chunk_age: 5m
      chunk_target_size: 1048576

    ruler:
      storage:
        type: local
        local:
          directory: /loki/rules
