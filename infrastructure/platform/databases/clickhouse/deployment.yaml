apiVersion: apps/v1
kind: Deployment

metadata:
  name: clickhouse
  namespace: mrun-system
  labels:
    app.kubernetes.io/name: clickhouse
    app.kubernetes.io/part-of: mrun-platform
    app.kubernetes.io/component: analytics-db

spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: clickhouse
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clickhouse
        app.kubernetes.io/part-of: mrun-platform
        app.kubernetes.io/component: analytics-db
    spec:
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:24.8
          ports:
            - name: http
              containerPort: 8123
            - name: native
              containerPort: 9000
          envFrom:
            - configMapRef:
                name: clickhouse-config
            - secretRef:
                name: clickhouse-secret
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 4Gi
          readinessProbe:
            httpGet:
              path: /ping
              port: 8123
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: clickhouse-data
