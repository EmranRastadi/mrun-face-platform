apiVersion: apps/v1
kind: Deployment

metadata:
  name: dragonfly
  namespace: mrun-system
  labels:
    app.kubernetes.io/name: dragonfly
    app.kubernetes.io/part-of: mrun-platform
    app.kubernetes.io/component: cache

spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dragonfly
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dragonfly
        app.kubernetes.io/part-of: mrun-platform
        app.kubernetes.io/component: cache
    spec:
      containers:
        - name: dragonfly
          image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
          args: ["--cache_mode=true", "--maxmemory=1gb"]
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          readinessProbe:
            tcpSocket:
              port: 6379
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 6379
            periodSeconds: 10
