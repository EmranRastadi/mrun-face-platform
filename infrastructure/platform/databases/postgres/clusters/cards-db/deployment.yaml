apiVersion: apps/v1
kind: Deployment
metadata:
  name: cards-db
  namespace: mrun-database
  labels:
    app.kubernetes.io/name: cards-db
    app.kubernetes.io/part-of: mrun-platform
    app.kubernetes.io/component: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cards-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cards-db
        app.kubernetes.io/part-of: mrun-platform
        app.kubernetes.io/component: database
    spec:
      containers:
        - name: postgres
          image: postgres:17
          env:
            - name: POSTGRES_DB
              value: cards
            - name: POSTGRES_USER
              value: cards
            - name: POSTGRES_PASSWORD
              value: cards
          ports:
            - containerPort: 5432
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "cards", "-d", "cards"]
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "cards", "-d", "cards"]
            initialDelaySeconds: 5
            periodSeconds: 10