apiVersion: v1
kind: Service

metadata:
  name: milvus
  namespace: mrun-system
  labels:
    app.kubernetes.io/name: milvus
    app.kubernetes.io/component: vector-db

spec:
  selector:
    app.kubernetes.io/name: milvus
  ports:
    - name: grpc
      port: 19530
      targetPort: 19530
    - name: metrics
      port: 9091
      targetPort: 9091
  type: ClusterIP
