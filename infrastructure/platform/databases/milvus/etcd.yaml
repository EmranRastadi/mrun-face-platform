apiVersion: v1
kind: Service

metadata:
  name: etcd
  namespace: mrun-system
  labels:
    app.kubernetes.io/name: etcd
    app.kubernetes.io/component: coordination

spec:
  selector:
    app.kubernetes.io/name: etcd
  ports:
    - name: client
      port: 2379
      targetPort: 2379
    - name: peer
      port: 2380
      targetPort: 2380
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: etcd
  namespace: mrun-system
  labels:
    app.kubernetes.io/name: etcd
    app.kubernetes.io/part-of: mrun-platform
    app.kubernetes.io/component: coordination

spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: etcd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: etcd
        app.kubernetes.io/part-of: mrun-platform
        app.kubernetes.io/component: coordination
    spec:
      containers:
        - name: etcd
          image: quay.io/coreos/etcd:v3.5.5
          command:
            - etcd
            - --advertise-client-urls=http://etcd:2379
            - --listen-client-urls=http://0.0.0.0:2379
            - --data-dir=/etcd
          ports:
            - name: client
              containerPort: 2379
            - name: peer
              containerPort: 2380
          volumeMounts:
            - name: data
              mountPath: /etcd
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          emptyDir: {}
