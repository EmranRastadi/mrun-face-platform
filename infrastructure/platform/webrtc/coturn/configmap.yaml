apiVersion: v1
kind: ConfigMap

metadata:
  name: coturn-config
  namespace: mrun-system

data:
  TURN_REALM: "mrun.local"
  TURN_MIN_PORT: "49160"
  TURN_MAX_PORT: "49200"
  TURN_LISTENING_PORT: "3478"
  # "auto" resolves to status.hostIP at container start (hostNetwork).
  # Replace with the node's public/NAT address before exposing coturn
  # outside the cluster.
  TURN_EXTERNAL_IP: "auto"
