apiVersion: v1
kind: ResourceQuota

metadata:
  name: app-resource-quota
  namespace: mrun-apps

spec:
  hard:
    requests.cpu: "8"
    requests.memory: 8Gi

    limits.cpu: "16"
    limits.memory: 16Gi

    pods: "50"

    services: "20"

    persistentvolumeclaims: "20"

    configmaps: "50"

    secrets: "50"