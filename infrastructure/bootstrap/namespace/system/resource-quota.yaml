apiVersion: v1
kind: ResourceQuota

metadata:
  name: system-resource-quota
  namespace: mrun-system

spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi

    limits.cpu: "8"
    limits.memory: 16Gi

    pods: "10"

    services: "20"

    persistentvolumeclaims: "20"

    configmaps: "50"

    secrets: "50"