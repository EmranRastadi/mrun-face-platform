apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:
  name: worker-service
  namespace: mrun-apps

spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: worker-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector: {}
  egress:
    - to:
        - namespaceSelector: {}
