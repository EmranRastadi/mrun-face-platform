apiVersion: v1
kind: ConfigMap

metadata:
  name: worker-service-config
  namespace: mrun-apps

data:
  ENVIRONMENT: "production"
  PORT: "8000"
  LOG_LEVEL: "INFO"

  CONSUL_HOST: "consul.mrun-system.svc.cluster.local"
  CONSUL_PORT: "8500"

  KAFKA_BROKERS: "kafka.mrun-messaging.svc.cluster.local:9092"
  KAFKA_ENABLED: "true"
