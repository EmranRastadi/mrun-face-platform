apiVersion: apps/v1
kind: Deployment

metadata:
  name: api-gateway
  namespace: mrun-apps
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: mrun-platform
    app.kubernetes.io/component: gateway

spec:
  replicas: 2

  strategy:
    type: RollingUpdate

  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway

  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-gateway
        app.kubernetes.io/part-of: mrun-platform
        app.kubernetes.io/component: gateway

    spec:
      serviceAccountName: api-gateway
      securityContext:
        fsGroup: 1000

      initContainers:
        - name: wait-for-consul
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until wget -q -O- http://consul.mrun-system.svc.cluster.local:8500/v1/status/leader; do
                echo "Waiting for Consul..."
                sleep 2
              done
              echo "Consul is ready!"

      containers:

        - name: api-gateway

          image: mrun/api-gateway

          imagePullPolicy: IfNotPresent

          ports:

            - containerPort: 3000

          envFrom:

            - configMapRef:
                name: api-gateway-config

            - secretRef:
                name: api-gateway-secret

          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP


          resources:

            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: 500m
              memory: 512Mi

          startupProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 5
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 10