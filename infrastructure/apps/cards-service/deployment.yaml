apiVersion: apps/v1
kind: Deployment

metadata:
  name: cards-service
  namespace: mrun-apps
  labels:
    app.kubernetes.io/name: cards-service
    app.kubernetes.io/part-of: mrun-platform
    app.kubernetes.io/component: vision

spec:
  replicas: 1

  strategy:
    type: RollingUpdate

  selector:
    matchLabels:
      app.kubernetes.io/name: cards-service

  template:

    metadata:
      labels:
        app.kubernetes.io/name: cards-service
        app.kubernetes.io/part-of: mrun-platform
        app.kubernetes.io/component: vision

    spec:

      serviceAccountName: cards-service

      securityContext:
        fsGroup: 1000

      initContainers:
        - name: wait-for-consul
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until wget -q -O- http://consul.mrun-system.svc.cluster.local:8500/v1/status/leader; do
                echo "Waiting for Consul..."
                sleep 2
              done
              echo "Consul is ready!"

      containers:

        - name: cards-service

          image: mrun/cards-service

          imagePullPolicy: IfNotPresent

          ports:

            - containerPort: 8000

          envFrom:

            - configMapRef:
                name: cards-service-config

            - secretRef:
                name: cards-service-secret

          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP

          resources:

            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: 500m
              memory: 512Mi

          startupProbe:

            httpGet:
              path: /health
              port: 8000

            periodSeconds: 5
            failureThreshold: 30

          readinessProbe:

            httpGet:
              path: /health
              port: 8000

            periodSeconds: 5

          livenessProbe:

            httpGet:
              path: /health
              port: 8000

            periodSeconds: 10