apiVersion: v1
kind: Service
metadata:
  name: cards-service
  namespace: mrun-apps

  labels:
    app.kubernetes.io/name: cards-service
    app.kubernetes.io/part-of: mrun-platform
    app.kubernetes.io/component: cards
  annotations:
    consul.hashicorp.com/service-name: cards-service
    consul.hashicorp.com/service-port: "8000"

spec:
  selector:
    app.kubernetes.io/name: cards-service

  ports:
    - name: http
      port: 3000
      targetPort: 8000

  type: ClusterIP