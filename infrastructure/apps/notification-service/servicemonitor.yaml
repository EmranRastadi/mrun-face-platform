apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor

metadata:
  name: notification-service
  namespace: mrun-apps
  labels:
    app.kubernetes.io/name: notification-service
    app.kubernetes.io/part-of: mrun-platform

spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: notification-service

  namespaceSelector:
    matchNames:
      - mrun-apps

  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
