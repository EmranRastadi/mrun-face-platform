apiVersion: v1
kind: ConfigMap

metadata:
  name: audit-service-config
  namespace: mrun-apps

data:
  ENVIRONMENT: "production"
  PORT: "3003"
  SERVICE_NAME: "audit-service"
  LOG_LEVEL: "INFO"

  CONSUL_HOST: "consul.mrun-system.svc.cluster.local"
  CONSUL_PORT: "8500"
  CONSUL_ENABLED: "true"

  KAFKA_BROKERS: "kafka.mrun-messaging.svc.cluster.local:9092"
  KAFKA_CLIENT_ID: "audit-service"
  KAFKA_GROUP_ID: "audit-workers"
  KAFKA_ENABLED: "true"

  #######################  START CLICKHOUSE ##########################
  CLICKHOUSE_HOST: "clickhouse.mrun-system.svc.cluster.local"
  CLICKHOUSE_PORT: "8123"
  CLICKHOUSE_USER: "default"
  CLICKHOUSE_DATABASE: "mrun"
  CLICKHOUSE_ENABLED: "true"
  #######################  END CLICKHOUSE ##########################

  OTEL_ENABLED: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://tempo.mrun-monitoring.svc.cluster.local:4318"
  OTEL_SERVICE_NAME: "audit-service"
