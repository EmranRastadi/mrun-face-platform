apiVersion: v1
kind: ConfigMap

metadata:
  name: identity-service-config
  namespace: mrun-apps

data:
  ENVIRONMENT: "production"
  PORT: "3000"
  SERVICE_NAME: "identity-service"
  LOG_LEVEL: "INFO"

  CONSUL_HOST: "consul.mrun-system.svc.cluster.local"
  CONSUL_PORT: "8500"
  CONSUL_ENABLED: "true"

  KAFKA_BROKERS: "kafka.mrun-messaging.svc.cluster.local:9092"
  KAFKA_CLIENT_ID: "identity-service"
  KAFKA_GROUP_ID: "identity-workers"
  KAFKA_ENABLED: "true"

  IDENTITY_RATE_LIMIT_PER_MINUTE: "30"
  IDENTITY_DEDUPE_TTL_SECONDS: "300"

  OTEL_ENABLED: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://tempo.mrun-monitoring.svc.cluster.local:4318"
  OTEL_SERVICE_NAME: "identity-service"
