apiVersion: apps/v1
kind: Deployment

metadata:
  name: identity-service
  namespace: mrun-apps
  labels:
    app.kubernetes.io/name: identity-service
    app.kubernetes.io/part-of: mrun-platform
    app.kubernetes.io/component: identity

spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: identity-service

  template:
    metadata:
      labels:
        app.kubernetes.io/name: identity-service
        app.kubernetes.io/part-of: mrun-platform
        app.kubernetes.io/component: identity
    spec:
      serviceAccountName: identity-service

      securityContext:
        fsGroup: 1000

      initContainers:
        - name: wait-for-consul
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until wget -q -O- http://consul.mrun-system.svc.cluster.local:8500/v1/status/leader; do
                echo "Waiting for Consul..."
                sleep 2
              done
              echo "Consul is ready!"

      containers:
        - name: identity-service
          image: mrun/identity-service
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 3000

          envFrom:
            - configMapRef:
                name: identity-service-config
            - secretRef:
                name: identity-service-secret

          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          readinessProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: 10
