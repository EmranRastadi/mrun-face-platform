apiVersion: apps/v1
kind: Deployment

metadata:
  name: identity-service
  namespace: mrun-apps
  labels:
    app.kubernetes.io/name: identity-service
    app.kubernetes.io/part-of: mrun-platform
    app.kubernetes.io/component: identity

spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: identity-service

  template:
    metadata:
      labels:
        app.kubernetes.io/name: identity-service
        app.kubernetes.io/part-of: mrun-platform
        app.kubernetes.io/component: identity
    spec:
      serviceAccountName: identity-service

      securityContext:
        fsGroup: 1000

      containers:
        - name: identity-service
          image: mrun/identity-service
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 3000

          envFrom:
            - configMapRef:
                name: identity-service-config
            - secretRef:
                name: identity-service-secret

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          readinessProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: 10
