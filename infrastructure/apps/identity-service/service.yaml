apiVersion: v1
kind: Service

metadata:
  name: identity-service
  namespace: mrun-apps
  annotations:
    consul.hashicorp.com/service-name: identity-service
    consul.hashicorp.com/service-port: "3000"

spec:
  selector:
    app.kubernetes.io/name: identity-service
  ports:
    - name: http
      port: 3000
      targetPort: 3000
  type: ClusterIP
