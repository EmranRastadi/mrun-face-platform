apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: identity-service
  namespace: mrun-apps

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: identity-service
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
