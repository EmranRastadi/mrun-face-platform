apiVersion: apps/v1
kind: Deployment

metadata:
  name: analytics-service
  namespace: mrun-apps
  labels:
    app.kubernetes.io/name: analytics-service
    app.kubernetes.io/part-of: mrun-platform
    app.kubernetes.io/component: analytics

spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: analytics-service

  template:
    metadata:
      labels:
        app.kubernetes.io/name: analytics-service
        app.kubernetes.io/part-of: mrun-platform
        app.kubernetes.io/component: analytics
    spec:
      serviceAccountName: analytics-service

      securityContext:
        fsGroup: 1000

      containers:
        - name: analytics-service
          image: mrun/analytics-service
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 3005

          envFrom:
            - configMapRef:
                name: analytics-service-config
            - secretRef:
                name: analytics-service-secret

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          readinessProbe:
            httpGet:
              path: /analytics/health
              port: 3005
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /analytics/health
              port: 3005
            periodSeconds: 10
