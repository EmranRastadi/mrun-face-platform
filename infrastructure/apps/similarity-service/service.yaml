apiVersion: v1
kind: Service

metadata:
  name: similarity-service
  namespace: mrun-apps
  annotations:
    consul.hashicorp.com/service-name: similarity-service
    consul.hashicorp.com/service-port: "8000"

spec:
  selector:
    app.kubernetes.io/name: similarity-service
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  type: ClusterIP
