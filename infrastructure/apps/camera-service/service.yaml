apiVersion: v1
kind: Service

metadata:
  name: camera-service
  namespace: mrun-apps
  annotations:
    consul.hashicorp.com/service-name: camera-service
    consul.hashicorp.com/service-port: "8000"
  labels:
    app.kubernetes.io/name: camera-service
    app.kubernetes.io/part-of: mrun-platform
spec:
  selector:
    app.kubernetes.io/name: camera-service
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  type: ClusterIP
