apiVersion: v1
kind: Secret

metadata:
  name: camera-service-secret
  namespace: mrun-apps

type: Opaque

# Development placeholders only. Must match the credentials configured on
# coturn (coturn-secret in mrun-system) because the browser fetches these from
# GET /webrtc/config to perform the TURN allocation.
stringData:
  TURN_USERNAME: "mrun"
  TURN_PASSWORD: "change-me-in-development"
  WEBRTC_SIGNALING_TOKEN: ""
