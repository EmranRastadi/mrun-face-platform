[pgbouncer]
listen_addr = 0.0.0.0:6543
auth_type = trust
pool_mode = session
max_client_conn = 100
default_pool_size = 20
reserve_pool_size = 5
reserve_pool_timeout = 3
server_login_timeout = 10
server_reset_query = DISCARD ALL
log_destination = stderr
syslog = 0
logging = 1
pidfile = /var/log/pgbouncer/pgbouncer.pid