apiVersion: skaffold/v4beta13
kind: Config

metadata:
  name: mrun-face-platform

build:
  local:
    push: false

  # Tag each image with a hash of its build inputs (source + Dockerfile) instead
  # of the git commit. Unchanged services keep their tag, so Skaffold reuses the
  # existing image and only rebuilt services get a new one.
  tagPolicy:
    inputDigest: {}

  artifacts:
    - image: mrun/api-gateway
      context: .
      docker:
        dockerfile: apps/api-gateway/Dockerfile

    - image: mrun/users-service
      context: .
      docker:
        dockerfile: apps/users-service/Dockerfile

    - image: mrun/identity-service
      context: .
      docker:
        dockerfile: apps/identity-service/Dockerfile

    - image: mrun/cards-service
      context: apps/cards-service
      docker:
        dockerfile: Dockerfile

    - image: mrun/camera-service
      context: apps/camera-service
      docker:
        dockerfile: Dockerfile

    - image: mrun/similarity-service
      context: apps/similarity-service
      docker:
        dockerfile: Dockerfile

    - image: mrun/worker-service
      context: apps/worker-service
      docker:
        dockerfile: Dockerfile

    - image: mrun/enrollment-service
      context: apps/enrollment-service
      docker:
        dockerfile: Dockerfile

    - image: mrun/audit-service
      context: .
      docker:
        dockerfile: apps/audit-service/Dockerfile

    - image: mrun/notification-service
      context: .
      docker:
        dockerfile: apps/notification-service/Dockerfile

    - image: mrun/analytics-service
      context: .
      docker:
        dockerfile: apps/analytics-service/Dockerfile

manifests:
  kustomize:
    paths:
      - infrastructure/bootstrap/namespace
      - infrastructure/platform/discovery
      - infrastructure/platform/external-services
      - infrastructure/platform/databases/dragonflydb
      - infrastructure/platform/databases/minio
      - infrastructure/platform/databases/milvus
      - infrastructure/platform/monitoring
      - infrastructure/apps
#      - infrastructure/platform/networking
      - infrastructure/platform/identity

deploy:
  kubectl: {}

profiles:
  - name: prod
    manifests:
      kustomize:
        paths:
          - infrastructure
