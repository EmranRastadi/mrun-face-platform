name: mrun-face-platform local stack
# Run: docker compose up -d   (copy .env.example to .env first)
# Data stores: postgres, dragonfly, minio, milvus, clickhouse + kafka, consul.

x-common-env: &common-env
  ENVIRONMENT: development
  LOG_LEVEL: INFO
  CONSUL_HOST: consul
  CONSUL_PORT: "8500"
  KAFKA_BROKERS: kafka:9092

services:
  # ==================== Infrastructure ====================
  postgres:
    image: postgres:16-alpine
    container_name: mrun-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mrun
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/vm/database/postgresql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - mrun-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    container_name: mrun-dragonfly
    ulimits:
      memlock: -1
    ports:
      - "6379:6379"
    volumes:
      - dragonfly_data:/data
    networks:
      - mrun-network
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: mrun-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - mrun-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: mrun-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - etcd_data:/etcd
    networks:
      - mrun-network
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v2.4.15
    container_name: mrun-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      - etcd
      - minio
    networks:
      - mrun-network
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: mrun-clickhouse
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DB: mrun
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"
      - "9002:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./infrastructure/vm/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - mrun-network
    restart: unless-stopped

  consul:
    image: hashicorp/consul:latest
    container_name: mrun-consul
    ports:
      - "8500:8500"
    networks:
      - mrun-network
    command: agent -dev -client=0.0.0.0 -ui
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.9.0
    container_name: mrun-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - mrun-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: mrun-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: mrun
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka
    networks:
      - mrun-network
    restart: unless-stopped

  # ==================== Application services ====================
  users-service:
    build:
      context: ./apps/users-service
      dockerfile: Dockerfile
    container_name: mrun-users
    ports:
      - "3001:3000"
    env_file:
      - path: ./apps/users-service/.env
        required: false
    environment:
      <<: *common-env
      DB_HOST: postgres
      DB_NAME: users
    depends_on:
      postgres:
        condition: service_healthy
      consul:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      - mrun-network
    restart: unless-stopped

  api-gateway:
    build:
      context: ./apps/api-gateway
      dockerfile: Dockerfile
    container_name: mrun-gateway
    ports:
      - "3000:3000"
    env_file:
      - path: ./apps/api-gateway/.env
        required: false
    environment:
      <<: *common-env
    depends_on:
      - users-service
    networks:
      - mrun-network
    restart: unless-stopped

  cards-service:
    build:
      context: ./apps/cards-service
      dockerfile: Dockerfile
    container_name: mrun-cards
    ports:
      - "8000:8000"
    env_file:
      - path: ./apps/cards-service/.env
        required: false
    environment:
      <<: *common-env
      DB_HOST: postgres
      DB_NAME: cards
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mrun-network
    restart: unless-stopped

  enrollment-service:
    build:
      context: ./apps/enrollment-service
      dockerfile: Dockerfile
    container_name: mrun-enrollment
    ports:
      - "8001:8001"
    env_file:
      - path: ./apps/enrollment-service/.env
        required: false
    environment:
      <<: *common-env
      DB_HOST: postgres
      DB_NAME: enrollment
      MINIO_ENDPOINT: minio:9000
      MILVUS_HOST: milvus
      KAFKA_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      milvus:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      - mrun-network
    restart: unless-stopped

  audit-service:
    build:
      context: .
      dockerfile: apps/audit-service/Dockerfile
    container_name: mrun-audit
    ports:
      - "3003:3003"
    env_file:
      - path: ./apps/audit-service/.env
        required: false
    environment:
      <<: *common-env
      KAFKA_ENABLED: "true"
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_ENABLED: "true"
    depends_on:
      - kafka
      - clickhouse
    networks:
      - mrun-network
    restart: unless-stopped

  notification-service:
    build:
      context: .
      dockerfile: apps/notification-service/Dockerfile
    container_name: mrun-notification
    ports:
      - "3004:3004"
    env_file:
      - path: ./apps/notification-service/.env
        required: false
    environment:
      <<: *common-env
      KAFKA_ENABLED: "true"
      DRAGONFLY_HOST: dragonfly
      DRAGONFLY_ENABLED: "true"
    depends_on:
      - kafka
      - dragonfly
    networks:
      - mrun-network
    restart: unless-stopped

  analytics-service:
    build:
      context: .
      dockerfile: apps/analytics-service/Dockerfile
    container_name: mrun-analytics
    ports:
      - "3005:3005"
    env_file:
      - path: ./apps/analytics-service/.env
        required: false
    environment:
      <<: *common-env
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_ENABLED: "true"
    depends_on:
      - clickhouse
    networks:
      - mrun-network
    restart: unless-stopped

networks:
  mrun-network:
    driver: bridge

volumes:
  postgres_data:
  dragonfly_data:
  minio_data:
  etcd_data:
  milvus_data:
  clickhouse_data:
  kafka_data:
